[package]
name = "jni-xbbg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "JNI (Java) bindings for the xbbg Bloomberg engine"
publish = false

[lib]
name = "xbbg_jni"
crate-type = ["cdylib"]

[dependencies]
jni = { workspace = true }
arrow = { workspace = true, features = ["ipc"] }
parking_lot = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "time", "macros"] }
xbbg_core = { workspace = true }
xbbg-async = { workspace = true }
xbbg-host = { workspace = true }
xbbg-log = { workspace = true }

[features]
default = ["live"]
live = ["xbbg_core/live", "xbbg-async/live", "xbbg-host/live"]
test-support = ["live", "xbbg-async/test-support", "xbbg-host/test-support"]

[lints]
workspace = true
