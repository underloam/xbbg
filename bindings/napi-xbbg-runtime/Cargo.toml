[package]
name = "napi-xbbg-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API (Node.js) resolver addon for xbbg: finds the provisioned Bloomberg runtime and preloads it; never links blpapi"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true }
napi-derive = { workspace = true }
# Default features only: the resolver. Never enable `provision` here (see the addon size budget).
xbbg-sdk = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
