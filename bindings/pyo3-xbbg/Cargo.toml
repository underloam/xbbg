[package]
name = "pyo3-xbbg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings for xbbg Bloomberg engine"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]

[dependencies]
mimalloc = { workspace = true, optional = true }
pyo3 = { workspace = true }
pyo3-async-runtimes = { workspace = true, features = ["tokio-runtime"] }
pyo3-stub-gen = { workspace = true, features = ["infer_signature"], optional = true }
tokio = { workspace = true, features = ["sync"] }
xbbg-log = { workspace = true }
arrow-array = { workspace = true, features = ["ffi", "chrono-tz"] }
arrow-schema = { workspace = true, features = ["ffi"] }
chrono = { workspace = true, features = ["std"] }
chrono-tz = { workspace = true }
pyo3-arrow = { workspace = true }
xbbg-arrow = { workspace = true }
serde_json = { workspace = true }
xbbg_core = { workspace = true }
xbbg-async = { workspace = true }
xbbg-ext = { workspace = true }
xbbg-recipes = { workspace = true }
[features]
default = ["live"]
mimalloc = ["dep:mimalloc"]
stub-gen = ["dep:pyo3-stub-gen"]
live = ["xbbg_core/live", "xbbg-async/live", "xbbg-recipes/live"]
