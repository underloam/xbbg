[package]
name = "napi-xbbg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "N-API (Node.js) bindings for xbbg Bloomberg engine"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { workspace = true, features = ["async", "tokio_rt", "serde-json", "napi4"] }
napi-derive = { workspace = true }
arrow = { workspace = true, features = ["ipc"] }
chrono = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
xbbg_core = { workspace = true }
xbbg-async = { workspace = true }
xbbg-log = { workspace = true }
xbbg-ext = { workspace = true }
xbbg-recipes = { workspace = true }
[features]
default = ["live"]
live = ["xbbg_core/live", "xbbg-async/live", "xbbg-recipes/live"]

[build-dependencies]
napi-build = { workspace = true }

[lints]
workspace = true
