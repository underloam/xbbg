[workspace]
members = [
    # Core engine
    "crates/xbbg-arrow",
    "crates/xbbg-core",
    "crates/blpapi-sys",
    "crates/xbbg-async",
    "crates/xbbg-ext",
    "crates/xbbg-recipes",
    "crates/xbbg-log",
    "crates/xbbg-bench",
    # Language bindings
    "bindings/pyo3-xbbg",
    "bindings/napi-xbbg",
    # Applications
    "apps/xbbg-mcp",
]
default-members = [
    "crates/xbbg-arrow",
    "crates/xbbg-core",
    "crates/blpapi-sys",
    "crates/xbbg-async",
    "crates/xbbg-ext",
    "crates/xbbg-recipes",
    "crates/xbbg-log",
    "crates/xbbg-bench",
    "bindings/pyo3-xbbg",
]
resolver = "2"

[workspace.package]
version = "1.4.7"
license = "Apache-2.0"
repository = "https://github.com/underloam/xbbg"
homepage = "https://xbbg.org/"
edition = "2021"
rust-version = "1.88"

# =============================================================================
# Workspace Dependencies
# =============================================================================
# Single source of truth for every third-party version. Members inherit with
# `{ workspace = true }` and layer only their own `features` on top.
#
# `default-features` MUST live here, not in the members: when a workspace entry
# omits it, a member's `default-features = false` is silently ignored (Cargo
# warns "`default-features` is ignored for X, since `default-features` was not
# specified for `workspace.dependencies.X`"). So every dependency that any
# member wants trimmed carries `default-features = false` below, and the members
# that genuinely want the default set spell it out in `features` instead.

[workspace.dependencies]
# ── Internal workspace crates ─────────────────────────────────────────────────
# Publishing requires every path dependency to also carry a `version`; a bare
# `{ path = ... }` makes `cargo publish` fail outright. Declaring both here is
# the single source of truth, so the release job stamps one file and
# `cargo set-version --workspace` keeps these in lockstep with
# `workspace.package.version`.
#
# `blpapi-sys` is published as `xbbg-blpapi-sys` (the bare name is taken on
# crates.io) while keeping `[lib] name = "blpapi_sys"`, so Rust code still says
# `blpapi_sys::` and only the registry name differs.
blpapi-sys = { package = "xbbg-blpapi-sys", path = "crates/blpapi-sys", version = "1.4.7" }
xbbg_core = { path = "crates/xbbg-core", version = "1.4.7", default-features = false }
xbbg-arrow = { path = "crates/xbbg-arrow", version = "1.4.7" }
xbbg-async = { path = "crates/xbbg-async", version = "1.4.7", default-features = false }
xbbg-ext = { path = "crates/xbbg-ext", version = "1.4.7" }
xbbg-log = { path = "crates/xbbg-log", version = "1.4.7" }
xbbg-recipes = { path = "crates/xbbg-recipes", version = "1.4.7", default-features = false }

# ── Arrow columnar carriers ───────────────────────────────────────────────────
arrow = { version = "59.2.0", default-features = false }
arrow-arith = "59.2.0"
# arrow-array declares no `default` feature, so disabling defaults is a no-op
# and simply keeps every member's inherit line uniform.
arrow-array = { version = "59.2.0", default-features = false }
arrow-buffer = "59.2.0"
arrow-data = "59.2.0"
arrow-ord = "59.2.0"
arrow-schema = "59.2.0"
arrow-select = "59.2.0"

# ── Async runtime and concurrency ─────────────────────────────────────────────
arc-swap = "1.9.2"
futures-util = "0.3.34"
once_cell = "1.21"
parking_lot = "0.12.5"
slab = "0.4.12"
smallvec = { version = "1.15", features = ["union"] }
tokio = "1.53"

# ── Date, time, and zone handling ─────────────────────────────────────────────
# Trimmed by 6 of 8 members. xbbg-async and xbbg-bench restore the default set
# ("clock", "std", "oldtime", "wasmbind") explicitly via `features`.
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"

# ── Serialization and number formatting ───────────────────────────────────────
itoa = "1.0"
ryu = "1.0"
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

# ── Errors, hashing, allocation ───────────────────────────────────────────────
anyhow = "1.0.104"
cty = "0.2.2"
indexmap = "2.14"
mimalloc = { version = "0.1.52", default-features = false }
phf = { version = "0.14.0", features = ["macros"] }
rustc-hash = "2.1"
thiserror = "2.0.20"

# ── Tracing ───────────────────────────────────────────────────────────────────
tracing = "0.1.44"
tracing-core = "0.1.36"
# xbbg-log wants only fmt/std/registry. The xbbg-async dev-dependency restores
# the default set ("smallvec", "fmt", "ansi", "tracing-log", "std") explicitly.
tracing-subscriber = { version = "0.3.23", default-features = false }

# ── Language bindings ─────────────────────────────────────────────────────────
napi = "3.12"
napi-build = "2.4"
napi-derive = "3.6"
pyo3 = "0.29.2"
pyo3-arrow = "0.19"
pyo3-async-runtimes = "0.29"
pyo3-stub-gen = { version = "0.23", default-features = false }
pyo3-stub-gen-derive = "0.23"

# ── MCP server ────────────────────────────────────────────────────────────────
rmcp = "3.1.2"

# ── Build-time and dev-only ───────────────────────────────────────────────────
bindgen = { version = "0.72.1", default-features = false }
criterion = "0.8.2"
dhat = "0.3.3"
hdrhistogram = "7.6"
simd-json = "0.17"
tempfile = "3.27"

# =============================================================================
# Performance-first Release Profile
# =============================================================================
# Shipped artifacts (wheels, napi addon, xbbg-mcp) build with this profile, so it
# optimizes for speed: measured 1.25-1.46x on columnar row loops vs opt-level "z"
# (probe over xbbg-arrow build_array/cell_from_array/cell_matches, same LTO/CGU).
# Size-sensitive builds can override with CARGO_PROFILE_RELEASE_OPT_LEVEL=z.

[profile.release]
lto = "fat"           # Full link-time optimization across all crates
codegen-units = 1     # Single codegen unit = better optimization opportunities
panic = "abort"       # No unwinding = smaller/faster code (can't catch panics)
strip = "symbols"     # Remove debug symbols for smaller binary
opt-level = 3         # Speed-first; size delta on wheels is small vs the 25-45% perf cost of "z"

# Optimize all deps in dev builds (many are unusably slow at opt-level 0)
[profile.dev.package."*"]
opt-level = 2
