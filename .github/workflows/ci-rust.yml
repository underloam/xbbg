name: CI

on:
  pull_request:
  push:
    branches: [main, feat/**, fix/**]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  UV_VERSION: "0.13.0"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Detect latest Bloomberg SDK version (runs first, others depend on it)
  # ════════════════════════════════════════════════════════════════════════════
  sdk-version:
    name: Detect SDK Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect latest downloadable Bloomberg C++ SDK version
        id: detect
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          detect-only: "true"

  # ════════════════════════════════════════════════════════════════════════════
  # Generate bindings once on Linux, consume artifact on Windows jobs
  # ════════════════════════════════════════════════════════════════════════════
  generate-bindings:
    name: Generate blpapi bindings artifact
    needs: sdk-version
    uses: ./.github/workflows/generate-bindings.yml
    with:
      sdk-version: ${{ needs.sdk-version.outputs.version }}

  # ════════════════════════════════════════════════════════════════════════════
  # Rust Lint (fast, no SDK needed)
  # ════════════════════════════════════════════════════════════════════════════
  lint-rust:
    name: Lint (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false

      - name: Rust format check
        run: cargo fmt --all -- --check

      - uses: cargo-bins/cargo-binstall@v1.25.2
      - name: Check unused Rust dependencies
        run: cargo binstall -y cargo-shear && cargo shear

  # ════════════════════════════════════════════════════════════════════════════
  # Codegen freshness (fast, no SDK needed)
  # ════════════════════════════════════════════════════════════════════════════
  codegen:
    name: Codegen Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt
          cache: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check generated files are up to date
        run: python defs/codegen/generate.py --check

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Test release tooling
        run: >-
          uv run --no-project --with "pytest>=8.4" --with "pytest-asyncio>=0.24" --with "packaging>=23.2"
          python -m pytest scripts -q

      - name: Check uv.lock is current
        run: uv lock --check

  # ════════════════════════════════════════════════════════════════════════════
  # Python Lint (fast, no SDK needed)
  # ════════════════════════════════════════════════════════════════════════════
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          environments: lint
          cache: true

      - name: Python lint
        run: pixi run -e lint lint

      - name: Python format check
        run: pixi run -e lint fmt-check

      - name: Python dead code checks
        run: |
          pixi run -e lint deadcode
          pixi run -e lint deadcode-langgraph

      - name: Python import graph checks
        run: |
          pixi run -e lint imports
          pixi run -e lint imports-langgraph

      - name: Type check (advisory)
        run: pixi run -e lint typecheck || true


  # JavaScript wrapper quality (Oxfmt/Oxlint/ESLint/TypeScript/Vitest)
  # ════════════════════════════════════════════════════════════════════════════
  lint-js:
    name: Quality (JS wrapper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          pixi-version: v0.81.0
          environments: js
          cache: true

      - name: Install js-xbbg dependencies
        working-directory: js-xbbg
        run: npm ci

      - name: JS quality suite
        run: pixi run -e js js-quality

  lint-js-langgraph:
    name: Quality (JS LangGraph, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported floor (engines >=24) and the current release line.
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            js-xbbg/package-lock.json
            js-xbbg-langgraph/package-lock.json

      # The adapter type-checks against this checkout's @xbbg/core declarations
      # (tsconfig paths -> js-xbbg/dist/index.d.ts). Without them TypeScript
      # falls back to the published @xbbg/core in node_modules, which lags the
      # source, so build them first as the release workflows do.
      - name: Build @xbbg/core type declarations
        working-directory: js-xbbg
        run: |
          npm ci
          npm run build:ts

      - name: Install js-xbbg-langgraph dependencies
        working-directory: js-xbbg-langgraph
        run: npm ci

      - name: JS LangGraph quality suite
        working-directory: js-xbbg-langgraph
        run: npm run quality

  # ════════════════════════════════════════════════════════════════════════════
  # Java Lint (fast, no SDK or natives needed)
  # ════════════════════════════════════════════════════════════════════════════
  lint-java:
    name: Lint (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Format check (google-java-format and ktfmt via Spotless)
        working-directory: java-xbbg
        run: ./mvnw -B -ntp spotless:check < /dev/null

      # Both modules: javac -Xlint:all and Error Prone on main and test code with -Werror,
      # javadoc with every doclint group (missing included) and warnings fatal, the Maven
      # Enforcer dependency rules, then spotbugs:check (effort Max, threshold Low) at verify.
      # No natives are needed: tests are skipped here and run in java-test.
      - name: Compile with Error Prone, javadoc, Enforcer and SpotBugs
        working-directory: java-xbbg
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip=true verify < /dev/null

  # ════════════════════════════════════════════════════════════════════════════
  # Security - cargo-audit (vulnerabilities)
  # ════════════════════════════════════════════════════════════════════════════
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@v1.25.2
      - run: cargo binstall -y cargo-audit && cargo audit

  # ════════════════════════════════════════════════════════════════════════════
  # Security - cargo-deny (licenses, bans, sources)
  # ════════════════════════════════════════════════════════════════════════════
  deny:
    name: Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@v1.25.2
      - run: cargo binstall -y cargo-deny && cargo deny check

  # ════════════════════════════════════════════════════════════════════════════
  # Check (clippy) - split by OS to enable Linux container + Windows artifact
  # ════════════════════════════════════════════════════════════════════════════
  check-linux:
    name: Check (Linux)
    needs: sdk-version
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xbbg-ci:latest
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bloomberg SDK (Linux)
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-unknown-linux-gnu
          components: clippy

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Offline Rust workspace tests
        run: cargo test --workspace

  check-windows:
    name: Check (Windows)
    needs: [sdk-version, generate-bindings]
    runs-on: windows-latest
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-pc-windows-msvc
          components: clippy

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path
        shell: pwsh
        run: |
          $bindingsPath = Join-Path $env:GITHUB_WORKSPACE "ci-bindings\bindings.rs"
          if (-not (Test-Path $bindingsPath)) {
            throw "Bindings artifact not found at $bindingsPath"
          }
          "BLPAPI_PREGENERATED_BINDINGS=$bindingsPath" >> $env:GITHUB_ENV

      - name: Setup Bloomberg SDK (Windows)
        id: sdk-windows
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Windows

      - name: Cargo clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

  check-macos:
    name: Check (macOS)
    needs: [sdk-version, generate-bindings]
    runs-on: macos-latest
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin
          components: clippy

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path (macOS)
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Setup Bloomberg SDK (macOS)
        id: sdk-macos
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: macOS

      - name: Cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ════════════════════════════════════════════════════════════════════════════
  # MSRV - every workspace member builds with the declared rust-version
  # ════════════════════════════════════════════════════════════════════════════
  # The published crates and the Python sdist compile on users' toolchains, so
  # `rust-version` in the root Cargo.toml is a contract, not a hint.
  msrv:
    name: MSRV
    needs: [sdk-version, generate-bindings]
    runs-on: ubuntu-latest
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Read rust-version
        id: msrv
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          # Leave build.warnings unset: older Cargo predates it, and older rustc
          # warns about lints added after it.
          build-warnings: ""

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Setup Bloomberg SDK (Linux)
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Cargo check at the MSRV
        run: cargo check --locked --workspace --all-targets

  # ════════════════════════════════════════════════════════════════════════════
  # NAPI core packaging validation
  # ════════════════════════════════════════════════════════════════════════════
  core-packages:
    name: NAPI Core Packages (${{ matrix.label }})
    needs: [sdk-version, generate-bindings]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            core_package_dir: js-xbbg/packages/xbbg-core-linux-x64
            # Match the release environment: build and smoke-test the addon in the
            # manylinux_2_28 container so glibc-floor regressions surface in CI,
            # not on release day.
            container: ghcr.io/${{ github.repository_owner }}/xbbg-manylinux:latest
          - os: windows-latest
            label: win32-x64
            core_package_dir: js-xbbg/packages/xbbg-core-win32-x64
          - os: macos-15
            label: darwin-arm64
            core_package_dir: js-xbbg/packages/xbbg-core-darwin-arm64

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: js-xbbg/package-lock.json

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path (Linux)
        if: runner.os == 'Linux'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Configure pre-generated bindings path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bindingsPath = Join-Path $env:GITHUB_WORKSPACE "ci-bindings\bindings.rs"
          if (-not (Test-Path $bindingsPath)) {
            throw "Bindings artifact not found at $bindingsPath"
          }
          "BLPAPI_PREGENERATED_BINDINGS=$bindingsPath" >> $env:GITHUB_ENV

      - name: Configure pre-generated bindings path (macOS)
        if: runner.os == 'macOS'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Setup Bloomberg SDK
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: ${{ runner.os }}

      - name: Install js-xbbg dependencies
        run: npm --prefix js-xbbg ci

      - name: Build js-xbbg native package
        run: npm --prefix js-xbbg run build

      - name: Keep fixture drivers out of the production addon
        run: node -e "const assert = require('node:assert/strict'); const addon = require('./js-xbbg/napi_xbbg.node'); assert.equal(Object.keys(addon).some(key => /fixture/i.test(key)), false);"

      - name: Stage packaged core native addon
        run: npm --prefix js-xbbg run stage:native-package

      - name: Enforce glibc 2.28 floor on native addon (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-glibc-max.sh 2.28 "${{ matrix.core_package_dir }}/napi_xbbg.node"

      - name: Validate core native package export
        run: |
          node -e "const addon = require('./${{ matrix.core_package_dir }}'); console.log(addon.binaryPath);"

      # Only this job builds the real addon on Linux, Windows, and macOS; the
      # Ubuntu JS quality job has none, so native-dependent suites such as
      # auction-native skip there. Run them under Bun while the local
      # js-xbbg/napi_xbbg.node still exists.
      - name: Install unzip for Bun setup (Linux container)
        if: runner.os == 'Linux'
        run: command -v unzip >/dev/null || dnf install -y unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Run offline JS suite under Bun
        working-directory: js-xbbg
        run: bun --bun run test

      - name: Remove local js-xbbg build artifact (Unix)
        if: runner.os != 'Windows'
        run: rm -f js-xbbg/napi_xbbg.node

      - name: Remove local js-xbbg build artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item js-xbbg\napi_xbbg.node -Force

      - name: Smoke test packaged @xbbg/core install
        shell: bash
        run: npm --prefix js-xbbg run smoke:packaged-install -- 0.0.0-ci

      - name: Smoke test packaged @xbbg/core install under Bun
        shell: bash
        run: npm --prefix js-xbbg run smoke:packaged-install -- --bun

      # The production package was staged and exercised above. Build the
      # synthetic SDK driver separately; never copy it into a package artifact.
      - name: Build subscription native test driver
        run: cargo build --locked -p napi-xbbg --features test-support

      - name: Stage subscription native test driver
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) addon=target/debug/libnapi_xbbg.so ;;
            macOS) addon=target/debug/libnapi_xbbg.dylib ;;
            Windows) addon=target/debug/napi_xbbg.dll ;;
            *) exit 1 ;;
          esac
          cp "$addon" js-xbbg/napi_xbbg.node

      - name: Exercise native subscription deliveries in Node and Bun
        working-directory: js-xbbg
        env:
          XBBG_TEST_SUBSCRIPTIONS: "1"
        run: |
          npx vitest run test/subscription-delivery-native.test.ts
          bun --bun ./node_modules/vitest/vitest.mjs run test/subscription-delivery-native.test.ts


      - name: Upload staged core package artifact
        uses: actions/upload-artifact@v7
        with:
          name: core-package-${{ matrix.label }}
          path: ${{ matrix.core_package_dir }}
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # Offline bundle packaging (one zip per platform, per commit)
  # ════════════════════════════════════════════════════════════════════════════
  pack-offline-bundles:
    name: Pack offline bundles
    needs: [core-packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Download linux core package artifact
        uses: actions/download-artifact@v8
        with:
          name: core-package-linux-x64
          path: js-xbbg/packages/xbbg-core-linux-x64

      - name: Download windows core package artifact
        uses: actions/download-artifact@v8
        with:
          name: core-package-win32-x64
          path: js-xbbg/packages/xbbg-core-win32-x64

      - name: Download macOS core package artifact
        uses: actions/download-artifact@v8
        with:
          name: core-package-darwin-arm64
          path: js-xbbg/packages/xbbg-core-darwin-arm64

      - name: Install js-xbbg dependencies
        working-directory: js-xbbg
        run: npm ci

      - name: Build offline bundles
        run: |
          mkdir -p dist-offline
          # npm --prefix runs the script from js-xbbg/, so a relative --out-dir
          # would land in js-xbbg/dist-offline instead of the uploaded path.
          for label in linux-x64 win32-x64 darwin-arm64; do
            npm --prefix js-xbbg run build:offline-bundle -- --label "$label" --out-dir "$GITHUB_WORKSPACE/dist-offline"
          done
          ls -1 dist-offline

      - name: Upload offline bundles
        uses: actions/upload-artifact@v7
        with:
          name: offline-bundles
          path: dist-offline/*.zip
          if-no-files-found: error
          retention-days: 7

  # ════════════════════════════════════════════════════════════════════════════
  # Java (java-xbbg): JNI natives per platform, one jar with all of them, tests on
  # Java 8-25, and Maven/Gradle consumers of the built jar
  # ════════════════════════════════════════════════════════════════════════════
  java-natives:
    name: Java Natives (${{ matrix.platform }})
    needs: [sdk-version, generate-bindings]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            # Same image as the release build, so the glibc 2.28 floor is enforced on every PR.
            container: ghcr.io/${{ github.repository_owner }}/xbbg-manylinux:latest
            python: /opt/python/cp312-cp312/bin/python
          - os: windows-latest
            platform: windows-x86_64
            python: python
          - os: macos-15
            platform: macos-aarch64
            python: python3
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path (Linux)
        if: runner.os == 'Linux'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Configure pre-generated bindings path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bindingsPath = Join-Path $env:GITHUB_WORKSPACE "ci-bindings\bindings.rs"
          if (-not (Test-Path $bindingsPath)) {
            throw "Bindings artifact not found at $bindingsPath"
          }
          "BLPAPI_PREGENERATED_BINDINGS=$bindingsPath" >> $env:GITHUB_ENV

      - name: Configure pre-generated bindings path (macOS)
        if: runner.os == 'macOS'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Setup Bloomberg SDK
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: ${{ runner.os }}

      # xbbg_sdk_jni's TLS stack (rustls with aws-lc-rs) compiles C code.
      - name: Ensure CMake for aws-lc-sys (Linux container)
        if: runner.os == 'Linux'
        run: command -v cmake >/dev/null || dnf install -y cmake

      # actions/checkout trusts the workspace only in a temporary global config. Without this,
      # git in the root-run container refuses the checkout ("dubious ownership"), the build
      # provenance records gitCommit=unknown, and release staging refuses it.
      - name: Trust the checkout (Linux container)
        if: runner.os == 'Linux'
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Production libraries: release-jni (panic=unwind), --locked, portable codegen, no
      # test-support, glibc <= 2.28 on Linux, relocatable on macOS (all checked by the script).
      - name: Stage release natives
        shell: bash
        run: ${{ matrix.python }} scripts/stage_jvm_natives.py stage --release --out "$GITHUB_WORKSPACE/java-natives/release"

      # Fixture driver for the Java test matrix; never copied into a jar artifact.
      - name: Stage test-support natives
        shell: bash
        env:
          # Line tables keep native backtraces readable at a fraction of full debug info's size.
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
        run: ${{ matrix.python }} scripts/stage_jvm_natives.py stage --locked --features test-support --out "$GITHUB_WORKSPACE/java-natives/test"

      - name: Verify staged natives
        shell: bash
        run: |
          ${{ matrix.python }} scripts/stage_jvm_natives.py verify --release --platform ${{ matrix.platform }} --natives java-natives/release
          ${{ matrix.python }} scripts/stage_jvm_natives.py verify --platform ${{ matrix.platform }} --natives java-natives/test

      - name: Upload release natives
        uses: actions/upload-artifact@v7
        with:
          name: java-natives-${{ matrix.platform }}
          path: java-natives/release/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload test-support natives
        uses: actions/upload-artifact@v7
        with:
          name: java-natives-test-${{ matrix.platform }}
          path: java-natives/test/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  java-package:
    name: Java Package
    needs: [java-natives]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download linux natives
        uses: actions/download-artifact@v8
        with:
          name: java-natives-linux-x86_64
          path: java-xbbg/natives/linux-x86_64

      - name: Download windows natives
        uses: actions/download-artifact@v8
        with:
          name: java-natives-windows-x86_64
          path: java-xbbg/natives/windows-x86_64

      - name: Download macOS natives
        uses: actions/download-artifact@v8
        with:
          name: java-natives-macos-aarch64
          path: java-xbbg/natives/macos-aarch64

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify release natives
        run: python3 scripts/stage_jvm_natives.py verify --release --natives java-xbbg/natives

      # Tests run in java-test against fixture natives; this job proves the distributable jar
      # builds (release natives guard, javadoc, sources) and publishes it to a file repository.
      - name: Build jars into a file repository
        working-directory: java-xbbg
        run: ./mvnw -B -Dxbbg.releaseNatives=true -DskipTests -DaltDeploymentRepository="ci::file://$RUNNER_TEMP/xbbg-maven-repo" deploy < /dev/null

      - name: Verify jar payloads
        run: |
          main_jar=java-xbbg/xbbg/target/xbbg-0.0.0-SNAPSHOT.jar
          scans=()
          for jar in java-xbbg/*/target/*.jar; do
            [[ "$jar" == "$main_jar" ]] || scans+=(--scan "$jar")
          done
          python3 scripts/stage_jvm_natives.py verify --release --natives "$main_jar" "${scans[@]}"

      - name: Upload Maven repository
        uses: actions/upload-artifact@v7
        with:
          name: java-maven-repo
          path: ${{ runner.temp }}/xbbg-maven-repo
          if-no-files-found: error
          retention-days: 7

  java-test:
    name: Java Test (${{ matrix.platform }}, Java ${{ matrix.java }})
    needs: [sdk-version, java-natives]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x86_64, windows-x86_64, macos-aarch64]
        java: ["8", "11", "17", "21", "25"]
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          # Exactly one configuration enforces the JaCoCo minimums (-Pcoverage); they were
          # measured on Java 21 with the native and subscription fixture tests.
          - platform: windows-x86_64
            java: "21"
            coverage: true
          - platform: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
      # Subscription fixture tests against the synthetic source of the test-support natives.
      XBBG_TEST_SUBSCRIPTIONS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bloomberg SDK
        id: sdk
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: ${{ runner.os }}

      - name: Point the native loader at the Bloomberg runtime
        shell: bash
        env:
          LIB_REL_DIR: ${{ steps.sdk.outputs.lib-rel-dir }}
          BIN_REL_DIR: ${{ steps.sdk.outputs.bin-rel-dir }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then dir="$BIN_REL_DIR"; else dir="$LIB_REL_DIR"; fi
          echo "BLPAPI_LIB_DIR=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_ENV"

      - name: Download test-support natives
        uses: actions/download-artifact@v8
        with:
          name: java-natives-test-${{ matrix.platform }}
          path: java-xbbg/natives/${{ matrix.platform }}

      - name: Setup test JDK
        uses: actions/setup-java@v6
        with:
          # Temurin publishes no Java 8 build for macOS arm64.
          distribution: ${{ (matrix.java == '8' && runner.os == 'macOS') && 'zulu' || 'temurin' }}
          java-version: ${{ matrix.java }}

      - name: Setup build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Compiles on 21 (--release 8/17); surefire forks the tests on the matrix JDK through
      # the toolchain setup-java registered. -Dxbbg.requireNatives=true fails instead of
      # skipping when native tests cannot load the fixture natives.
      - name: Unit and native tests
        working-directory: java-xbbg
        shell: bash
        env:
          COVERAGE: ${{ matrix.coverage && '-Pcoverage' || '' }}
        run: ./mvnw -B -Dtest.jdk=${{ matrix.java }} -Dxbbg.requireNatives=true ${COVERAGE:+"$COVERAGE"} verify < /dev/null

  # Newest GA JDK, advisory (not in ci-status): new releases can break before we adapt.
  java-test-latest:
    name: Java Test (${{ matrix.platform }}, latest GA Java)
    needs: [sdk-version, java-natives]
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
      XBBG_TEST_SUBSCRIPTIONS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bloomberg SDK
        id: sdk
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: ${{ runner.os }}

      - name: Point the native loader at the Bloomberg runtime
        shell: bash
        env:
          LIB_REL_DIR: ${{ steps.sdk.outputs.lib-rel-dir }}
          BIN_REL_DIR: ${{ steps.sdk.outputs.bin-rel-dir }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then dir="$BIN_REL_DIR"; else dir="$LIB_REL_DIR"; fi
          echo "BLPAPI_LIB_DIR=$GITHUB_WORKSPACE/$dir" >> "$GITHUB_ENV"

      - name: Download test-support natives
        uses: actions/download-artifact@v8
        with:
          name: java-natives-test-${{ matrix.platform }}
          path: java-xbbg/natives/${{ matrix.platform }}

      - name: Setup latest GA JDK
        id: latest
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: latest

      - name: Setup build JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit and native tests
        working-directory: java-xbbg
        shell: bash
        env:
          # setup-java registers the resolved version (e.g. 27.0.1+8) as the toolchain version.
          TEST_JDK: ${{ steps.latest.outputs.version }}
        run: ./mvnw -B "-Dtest.jdk=$TEST_JDK" -Dxbbg.requireNatives=true verify < /dev/null

  java-consumer-smoke:
    name: Java Consumer Smoke (${{ matrix.platform }})
    needs: [sdk-version, java-package]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          - platform: macos-aarch64
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate the committed Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Download Maven repository
        uses: actions/download-artifact@v8
        with:
          name: java-maven-repo
          path: ${{ runner.temp }}/xbbg-maven-repo

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The consumers provision the Bloomberg runtime from this local wheel through
      # xbbg_sdk_jni. No SDK is installed or on any library path in this job, so loading
      # also proves xbbg_sdk_jni works without blpapi.
      - name: Download the Bloomberg runtime wheel
        shell: bash
        run: |
          wheels="$RUNNER_TEMP/blpapi-wheel"
          python -m pip download --no-deps --only-binary=:all: \
            --index-url https://blpapi.bloomberg.com/repository/releases/python/simple/ \
            --dest "$wheels" "blpapi==$BLPAPI_VERSION"
          wheel=$(python -c 'import pathlib, sys; [w] = pathlib.Path(sys.argv[1]).glob("*.whl"); print(w.resolve())' "$wheels")
          repo=$(python -c 'import pathlib, sys; print(pathlib.Path(sys.argv[1]).resolve().as_uri())' "$RUNNER_TEMP/xbbg-maven-repo")
          echo "BLPAPI_WHEEL=$wheel" >> "$GITHUB_ENV"
          echo "XBBG_REPO_URL=$repo" >> "$GITHUB_ENV"

      # No Maven cache: the consumer resolves into a fresh local repository (below).
      - name: Setup Java 8
        uses: actions/setup-java@v6
        with:
          # Temurin publishes no Java 8 build for macOS arm64.
          distribution: ${{ runner.os == 'macOS' && 'zulu' || 'temurin' }}
          java-version: "8"

      - name: Setup Java 11, 17, 25 and 21 (default)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17
            25
            21
          cache: gradle

      # A fresh local repository, so the consumer tests this run's jars and never an xbbg
      # restored from a cache or left by an earlier build.
      - name: Maven consumer on Java 8, 11, 17, 21, 25
        working-directory: java-xbbg/consumers/maven
        shell: bash
        run: |
          for jdk in 8 11 17 21 25; do
            ./mvnw -B -Dmaven.repo.local="$RUNNER_TEMP/consumer-m2" -Drun.jdk="$jdk" -Dxbbg.repo.url="$XBBG_REPO_URL" \
              -Dconsumer.blpapiArtifact="$BLPAPI_WHEEL" verify < /dev/null
          done

      - name: Gradle consumer on Java 8, 11, 17, 21, 25
        working-directory: java-xbbg/consumers/gradle
        shell: bash
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=X64 ;;
            ARM64) arch=AARCH64 ;;
            *) echo "::error::unsupported runner architecture $RUNNER_ARCH"; exit 1 ;;
          esac
          homes=()
          for jdk in 8 11 17 21 25; do
            name="JAVA_HOME_${jdk}_${arch}"
            [[ -n "${!name:-}" ]] || { echo "::error::$name is not set"; exit 1; }
            homes+=("$name")
          done
          from_env=$(IFS=,; echo "${homes[*]}")
          ./gradlew --no-daemon --warning-mode=fail \
            -Dorg.gradle.java.installations.fromEnv="$from_env" \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false \
            -PxbbgRepo="$XBBG_REPO_URL" -PblpapiArtifact="$BLPAPI_WHEEL" smoke < /dev/null

  # ════════════════════════════════════════════════════════════════════════════
  # Build wheels via setuptools-rust + uv (matrix: OS × Python version)
  # ════════════════════════════════════════════════════════════════════════════
  # 3.14t/3.15t build free-threaded (cp314t/cp315t) wheels. These legs gate like
  # the others because releases ship them; the test-freethreaded job that runs
  # them stays advisory.
  build:
    name: Build (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [sdk-version, generate-bindings, check-linux, check-windows, check-macos]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc, aarch64-apple-darwin]
        exclude:
          # Linux target only on ubuntu
          - os: ubuntu-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: aarch64-apple-darwin
          # Windows target only on windows
          - os: windows-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-pc-windows-msvc
        include:
          # Probe for the ubuntu-latest move to Ubuntu 26.04 (gradual rollout
          # 2026-10-19 to 2026-11-19). Drop this leg once the rollout completes.
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            python: "3.14"

    runs-on: ${{ matrix.os }}
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Download pre-generated bindings
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Configure pre-generated bindings path (Linux)
        if: runner.os == 'Linux'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Configure pre-generated bindings path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bindingsPath = Join-Path $env:GITHUB_WORKSPACE "ci-bindings\bindings.rs"
          if (-not (Test-Path $bindingsPath)) {
            throw "Bindings artifact not found at $bindingsPath"
          }
          "BLPAPI_PREGENERATED_BINDINGS=$bindingsPath" >> $env:GITHUB_ENV

      - name: Configure pre-generated bindings path (macOS)
        if: runner.os == 'macOS'
        run: |
          BINDINGS_PATH="$GITHUB_WORKSPACE/ci-bindings/bindings.rs"
          test -s "$BINDINGS_PATH"
          echo "BLPAPI_PREGENERATED_BINDINGS=$BINDINGS_PATH" >> "$GITHUB_ENV"

      - name: Setup Bloomberg SDK (Linux)
        if: runner.os == 'Linux'
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Bloomberg SDK (Windows)
        if: runner.os == 'Windows'
        id: sdk-windows
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Windows

      - name: Setup Bloomberg SDK (macOS)
        if: runner.os == 'macOS'
        id: sdk-macos
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: macOS

      - name: Setup Python ${{ matrix.python }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Setup uv
        # Exact tag: astral-sh/setup-uv stopped publishing moving major tags
        # after v7, so `@v10` does not resolve.
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build wheel (setuptools-rust via uv)
        env:
          # Build for the interpreter setup-python selected (free-threaded on the
          # t legs), not whichever one uv's discovery reaches first.
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        run: uv build --wheel --out-dir dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*.whl

  # ════════════════════════════════════════════════════════════════════════════
  # Test wheels (matrix: OS × Python version)
  # ════════════════════════════════════════════════════════════════════════════
  test:
    name: Test (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [sdk-version, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # Tests the wheel from the Ubuntu 26.04 build probe leg.
          - os: ubuntu-26.04
            python: "3.14"

    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}

    runs-on: ${{ matrix.os }}
    # Unit tests must never open a Bloomberg session; a leaked engine start has
    # hung Windows runners for the full 6h default. Bound it hard.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Setup Bloomberg SDK (Linux)
        if: runner.os == 'Linux'
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Bloomberg SDK (macOS)
        if: runner.os == 'macOS'
        id: sdk-macos
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: macOS

      - name: Setup Bloomberg SDK (Windows)
        if: runner.os == 'Windows'
        id: sdk-windows
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Windows

      - name: Install wheel and test dependencies
        shell: bash
        run: |
          # Install the specific wheel for this Python version
          WHEEL=$(echo dist/*.whl)
          # Hold the suite to the current dataframe majors so a resolver
          # fallback cannot quietly test older ones; the
          # dataframe-previous-majors job covers pandas 2 and polars 1.
          uv pip install --system "${WHEEL}[test]" "pandas>=3" "polars>=2"

      - name: Copy tests to temp directory
        # Run from temp dir to avoid importing local source instead of installed package
        run: |
          mkdir -p "${{ runner.temp }}/test-run"
          cp -r py-xbbg/tests "${{ runner.temp }}/test-run/"
        shell: bash

      - name: Run tests
        working-directory: ${{ runner.temp }}/test-run
        run: |
          python -c "from xbbg import _core; assert not any('fixture' in name.lower() for name in vars(_core)), 'test driver leaked into production extension'"
          pytest tests -v -m "not live"

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        working-directory: ${{ runner.temp }}/test-run
        run: pytest tests --cov=xbbg --cov-report=xml -v -m "not live"

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Setup Rust for native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Download bindings for native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Exercise Python native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        shell: bash
        env:
          BLPAPI_PREGENERATED_BINDINGS: ${{ github.workspace }}/ci-bindings/bindings.rs
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export XBBG_DIST_VERSION="$(python -c 'from importlib.metadata import version; print(version("xbbg"))')"
          cargo build --locked -p pyo3-xbbg --features test-support
          CORE_TARGET="$(python -c 'from importlib.metadata import distribution; print(next(distribution("xbbg").locate_file("xbbg").glob("_core*.so")))')"
          CORE_BACKUP="$RUNNER_TEMP/core-delivery-original.so"
          cp "$CORE_TARGET" "$CORE_BACKUP"
          trap 'cp "$CORE_BACKUP" "$CORE_TARGET"; rm -f "$CORE_BACKUP"' EXIT
          cp target/debug/lib_core.so "$CORE_TARGET"
          (
            cd "$RUNNER_TEMP/test-run"
            XBBG_REQUIRE_TEST_SUPPORT=1 python -m pytest tests/test_subscription_delivery_native.py tests/test_native_bridge.py tests/test_native_teardown.py tests/test_free_threading_stress.py -q
          )

      # xbbg-langgraph stays below 3.15 until its dependency chain publishes 3.15
      # wheels: PyYAML (via langchain-core) and zstandard (via langsmith) have none
      # on any platform, nor does orjson for Linux.
      - name: Install Python LangGraph adapter
        if: matrix.python != '3.15'
        shell: bash
        # This run's wheel carries an untagged CI version below the adapter's
        # `xbbg>=1.6.0` floor. Without the override uv swaps it for the newest
        # PyPI release, and the adapter tests would exercise that instead.
        run: |
          python -c "import glob, pathlib; print('xbbg @ ' + pathlib.Path(glob.glob('dist/*.whl')[0]).resolve().as_uri())" > "${{ runner.temp }}/xbbg-override.txt"
          uv pip install --system --override "${{ runner.temp }}/xbbg-override.txt" "./py-xbbg-langgraph[test]"

      - name: Test Python LangGraph adapter
        if: matrix.python != '3.15'
        run: pytest py-xbbg-langgraph/tests -v

  # ════════════════════════════════════════════════════════════════════════════
  # Test free-threaded wheels (advisory: not a ci-status requirement)
  # ════════════════════════════════════════════════════════════════════════════
  # Installs only the optional dependencies xbbg supports on free-threaded Python
  # (pyarrow, pandas): polars and duckdb publish no free-threaded wheels, so their
  # tests skip. The LangGraph adapter is not installed either, because langsmith
  # requires zstandard and orjson, which publish none. PYTHON_GIL stays unset so
  # an import that re-enables the GIL fails the run instead of going unnoticed.
  test-freethreaded:
    name: Test free-threaded (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [sdk-version, build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.14t", "3.15t"]

    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python ${{ matrix.python }}
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python }}
          path: dist

      - name: Setup Bloomberg SDK (Linux)
        if: runner.os == 'Linux'
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Bloomberg SDK (macOS)
        if: runner.os == 'macOS'
        id: sdk-macos
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: macOS

      - name: Setup Bloomberg SDK (Windows)
        if: runner.os == 'Windows'
        id: sdk-windows
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Windows

      - name: Install wheel and free-threaded test dependencies
        shell: bash
        env:
          UV_PYTHON: ${{ steps.setup-python.outputs.python-path }}
        # --no-build: a dependency without a free-threaded wheel fails here
        # instead of compiling from source.
        run: |
          WHEEL=$(echo dist/*.whl)
          uv pip install --system --no-build "${WHEEL}" "pytest>=8.4" "pytest-asyncio>=0.24" "pytest-run-parallel>=0.10" "pyarrow>=22.0.0" "pandas>=3"

      - name: Copy tests to temp directory
        # Run from temp dir to avoid importing local source instead of installed package
        run: |
          mkdir -p "${{ runner.temp }}/test-run"
          cp -r py-xbbg/tests "${{ runner.temp }}/test-run/"
        shell: bash

      - name: Run tests
        working-directory: ${{ runner.temp }}/test-run
        shell: bash
        run: |
          python -c "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED'), 'setup-python selected a GIL build'"
          python -W error::RuntimeWarning -c "import sys, xbbg, pyarrow, pandas; xbbg.get_log_level(); xbbg.get_sdk_info(); assert not sys._is_gil_enabled(), 'an import re-enabled the GIL'"
          python -c "from xbbg import _core; assert not any('fixture' in name.lower() for name in vars(_core)), 'test driver leaked into production extension'"
          pytest tests -v -m "not live"

      # pytest-run-parallel runs each test body in 8 threads at once. Tests marked
      # thread_unsafe (async tests, and tests that change process-wide state such
      # as configure() or middleware) still run, in one thread.
      - name: Run tests in parallel threads
        working-directory: ${{ runner.temp }}/test-run
        shell: bash
        run: pytest tests -q -m "not live" --parallel-threads=8

      - name: Setup Rust for native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14t'
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Download bindings for native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14t'
        uses: actions/download-artifact@v8
        with:
          name: blpapi-bindings
          path: ci-bindings

      - name: Exercise Python native test-support drivers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14t'
        shell: bash
        env:
          BLPAPI_PREGENERATED_BINDINGS: ${{ github.workspace }}/ci-bindings/bindings.rs
        run: |
          export PYO3_PYTHON="$(python -c 'import sys; print(sys.executable)')"
          export XBBG_DIST_VERSION="$(python -c 'from importlib.metadata import version; print(version("xbbg"))')"
          cargo build --locked -p pyo3-xbbg --features test-support
          CORE_TARGET="$(python -c 'from importlib.metadata import distribution; print(next(distribution("xbbg").locate_file("xbbg").glob("_core*.so")))')"
          CORE_BACKUP="$RUNNER_TEMP/core-delivery-original.so"
          cp "$CORE_TARGET" "$CORE_BACKUP"
          trap 'cp "$CORE_BACKUP" "$CORE_TARGET"; rm -f "$CORE_BACKUP"' EXIT
          cp target/debug/lib_core.so "$CORE_TARGET"
          (
            cd "$RUNNER_TEMP/test-run"
            XBBG_REQUIRE_TEST_SUPPORT=1 python -m pytest tests/test_subscription_delivery_native.py tests/test_native_bridge.py tests/test_native_teardown.py tests/test_free_threading_stress.py -q
          )

  # ════════════════════════════════════════════════════════════════════════════
  # Declared floors - resolve the lower bounds we advertise and actually run them
  # ════════════════════════════════════════════════════════════════════════════
  # Without this, every floor in `[project.optional-dependencies]` is an untested
  # claim: the lockfiles only ever exercise the newest release. Runs on the lowest
  # supported interpreter because that is where the oldest wheels are selectable
  # (on 3.14 the floors get dragged upward by wheel availability anyway).
  floors:
    name: Declared floors (lowest-direct, Python 3.11)
    needs: [sdk-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest-py3.11
          path: dist

      - name: Setup Bloomberg SDK
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Install wheel at declared floors
        shell: bash
        env:
          UV_RESOLUTION: lowest-direct
        # lowest-direct lowers only direct requirements, and a wheel's own
        # dependencies are transitive, so `${WHEEL}[test]` alone resolves the
        # newest releases. Naming the declared requirements makes them direct.
        run: |
          WHEEL=$(echo dist/*.whl)
          uv pip install --system "${WHEEL}[test]" -r pyproject.toml --extra test

      - name: Show resolved floor versions
        run: uv pip list --system

      - name: Copy tests to temp directory
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/test-run"
          cp -r py-xbbg/tests "${{ runner.temp }}/test-run/"

      - name: Run tests at declared floors
        working-directory: ${{ runner.temp }}/test-run
        run: pytest tests -v -m "not live"

      - name: Install Python LangGraph adapter at declared floors
        env:
          UV_RESOLUTION: lowest-direct
        run: uv pip install --system "./py-xbbg-langgraph[test]"

      - name: Test Python LangGraph adapter at declared floors
        run: pytest py-xbbg-langgraph/tests -v

  # ════════════════════════════════════════════════════════════════════════════
  # Previous dataframe majors - pandas 2.x and polars 1.x stay supported
  # ════════════════════════════════════════════════════════════════════════════
  # The test matrix pins the current majors and the floors job runs the oldest
  # releases, so this job covers the newest releases of the previous majors.
  dataframe-previous-majors:
    name: Previous dataframe majors (pandas 2, polars 1)
    needs: [sdk-version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest-py3.12
          path: dist

      - name: Setup Bloomberg SDK
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Install wheel with pandas 2 and polars 1
        shell: bash
        run: |
          WHEEL=$(echo dist/*.whl)
          uv pip install --system "${WHEEL}[test]" "pandas<3" "polars<2"

      - name: Show resolved dataframe versions
        run: uv pip list --system

      - name: Copy tests to temp directory
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/test-run"
          cp -r py-xbbg/tests "${{ runner.temp }}/test-run/"

      - name: Run tests
        working-directory: ${{ runner.temp }}/test-run
        run: pytest tests -v -m "not live"

  # ════════════════════════════════════════════════════════════════════════════
  # Unsafe Code Audit (optional, non-blocking)
  # ════════════════════════════════════════════════════════════════════════════
  geiger:
    name: Unsafe Audit
    needs: [sdk-version, check-linux]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xbbg-ci:latest
    continue-on-error: true
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bloomberg SDK (Linux)
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rust-src
          build-warnings: warn

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Install cargo-geiger
        run: cargo binstall -y --force cargo-geiger

      - name: Validate audit manifest paths
        run: |
          for manifest in crates/blpapi-sys/Cargo.toml crates/xbbg-core/Cargo.toml crates/xbbg-async/Cargo.toml bindings/pyo3-xbbg/Cargo.toml; do
            test -f "$manifest"
          done

      - name: Run cargo-geiger (advisory)
        continue-on-error: true
        run: |
          status=0
          for manifest in crates/blpapi-sys/Cargo.toml crates/xbbg-core/Cargo.toml crates/xbbg-async/Cargo.toml bindings/pyo3-xbbg/Cargo.toml; do
            echo "=== $manifest ==="
            # Generated bindings and C sources can leave files unscanned.
            cargo-geiger --manifest-path "$GITHUB_WORKSPACE/$manifest" || status=1
          done
          exit "$status"


  # ════════════════════════════════════════════════════════════════════════════
  # Bloomberg SDK ABI Compatibility (optional, non-blocking)
  # ════════════════════════════════════════════════════════════════════════════
  abi-compat:
    name: ABI Compat
    needs: sdk-version
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xbbg-ci:latest
    continue-on-error: true
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install bindgen-cli
        run: cargo install bindgen-cli --version 0.73.2

      - name: Run ABI compatibility check
        run: |
          # Read min supported version from defs/bloomberg.toml (single source of truth),
          # then check that version plus the latest detected SDK.
          MIN_SDK=$(grep '^min_sdk_version' defs/bloomberg.toml | sed 's/.*= *"\(.*\)"/\1/')
          bash scripts/abi-check.sh --versions "$MIN_SDK $BLPAPI_VERSION"

  # ════════════════════════════════════════════════════════════════════════════
  # Semver Compatibility (optional, non-blocking)
  # ════════════════════════════════════════════════════════════════════════════
  semver:
    name: Semver Check
    needs: [sdk-version, check-linux]
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xbbg-ci:latest
    continue-on-error: true
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for baseline

      - name: Setup Bloomberg SDK (Linux)
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Install cargo-binstall
        run: curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
      - name: Run cargo-semver-checks
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo binstall -y --force cargo-semver-checks
          # Check if Rust crates directory exists in main branch
          if git show origin/main:crates/xbbg-core/Cargo.toml >/dev/null 2>&1; then
            cargo-semver-checks --baseline-rev origin/main
          else
            echo "Skipping: Rust crates not in baseline yet (will run after merge to main)"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # CI Status (required gate for merging)
  # ════════════════════════════════════════════════════════════════════════════
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    # geiger, abi-compat, semver, test-freethreaded, and java-test-latest are intentionally advisory.
    needs: [sdk-version, generate-bindings, codegen, lint-rust, lint-python, lint-js, lint-js-langgraph, lint-java, audit, deny, check-linux, check-windows, check-macos, msrv, core-packages, pack-offline-bundles, java-natives, java-package, java-test, java-consumer-smoke, build, test, floors, dataframe-previous-majors]
    if: always()
    steps:
      - name: Check required jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS_JSON" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            echo "::error::One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required CI checks passed"

  # ════════════════════════════════════════════════════════════════════════════
  # Auto-generate type stubs (runs LAST, only after all CI passes)
  # ════════════════════════════════════════════════════════════════════════════
  update-stubs:
    name: Update Type Stubs
    needs: [sdk-version, ci-status]
    if: needs.ci-status.result == 'success' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/${{ github.repository_owner }}/xbbg-ci:latest
    continue-on-error: true
    permissions:
      contents: write
      packages: read
    env:
      BLPAPI_VERSION: ${{ needs.sdk-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git for container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bloomberg SDK
        id: sdk-linux
        uses: ./.github/actions/setup-blpapi-sdk
        with:
          version: ${{ env.BLPAPI_VERSION }}
          os: Linux

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: warn

      - name: Build stub generator
        run: cargo build -p pyo3-xbbg --bin stub_gen --no-default-features --features live,stub-gen

      - name: Test stub postprocessor
        run: cargo test -p pyo3-xbbg --bin stub_gen --no-default-features --features live,stub-gen

      - name: Regenerate stubs
        run: |
          CARGO_MANIFEST_DIR="$GITHUB_WORKSPACE/bindings/pyo3-xbbg" ./target/debug/stub_gen
          python3 scripts/generate_package_stub.py

      - name: Commit stubs if changed
        run: |
          git add py-xbbg/src/xbbg/_core.pyi py-xbbg/src/xbbg/__init__.pyi py-xbbg/src/xbbg/py.typed
          if git diff --cached --quiet; then
            echo "Type stubs are already up to date"
          else
            git commit -m "chore: regenerate type stubs [skip ci]"
            git push
          fi
