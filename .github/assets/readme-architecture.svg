<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xbbg architecture</title>
  <desc id="desc">Four application surfaces backed by one shared Rust and Arrow engine over the Bloomberg C++ SDK.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173f38"/>
      <stop offset="0.58" stop-color="#15302b"/>
      <stop offset="1" stop-color="#1b1a1f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1200" height="260" rx="26"/>
    </clipPath>
  </defs>
  <rect width="1200" height="260" rx="26" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <text x="-10" y="252" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="260" font-weight="800" fill="#ffffff" opacity="0.025">xbbgxbbgxbbgxbbg</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="259" rx="25.5" stroke="#ffffff" stroke-opacity="0.11"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="28" y="34" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="1.4">APPLICATION SURFACES</text>
    <text x="430" y="34" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="1.4">SHARED RUST ENGINE</text>
    <text x="900" y="34" font-size="12" font-weight="700" fill="#5eead4" letter-spacing="1.4">BLOOMBERG C++ SDK</text>
    <g transform="translate(28 54)">
      <rect width="352" height="40" rx="10" fill="#102521" stroke="#5eead4" stroke-opacity="0.32"/>
      <text x="14" y="17" font-size="13" font-weight="700" fill="#ffffff">Python · xbbg</text>
      <text x="14" y="32" font-size="11" fill="#a7beb7">Sync &amp; async · Narwhals, PyArrow, pandas, Polars, DuckDB</text>
    </g>
    <g transform="translate(28 101)">
      <rect width="352" height="40" rx="10" fill="#102521" stroke="#5eead4" stroke-opacity="0.32"/>
      <text x="14" y="17" font-size="13" font-weight="700" fill="#ffffff">TypeScript · @xbbg/core</text>
      <text x="14" y="32" font-size="11" fill="#a7beb7">Native N-API addon · Apache Arrow tables &amp; JSON rows</text>
    </g>
    <g transform="translate(28 148)">
      <rect width="352" height="40" rx="10" fill="#102521" stroke="#5eead4" stroke-opacity="0.32"/>
      <text x="14" y="17" font-size="13" font-weight="700" fill="#ffffff">Java · io.github.underloam:xbbg</text>
      <text x="14" y="32" font-size="11" fill="#a7beb7">JNI bindings (Java 8+) &amp; xbbg-jdk17 (Flow, Arrow Java)</text>
    </g>
    <g transform="translate(28 195)">
      <rect width="352" height="40" rx="10" fill="#102521" stroke="#5eead4" stroke-opacity="0.32"/>
      <text x="14" y="17" font-size="13" font-weight="700" fill="#ffffff">Agents · xbbg-mcp &amp; langgraph</text>
      <text x="14" y="32" font-size="11" fill="#a7beb7">Standalone MCP server &amp; LangChain / LangGraph tools</text>
    </g>
    <!-- Connector: surfaces -> engine -->
    <path d="M380 74 H404 M380 121 H404 M380 168 H404 M380 215 H404 M404 74 V215 M404 144.5 H424" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M420 140.5 L427 144.5 L420 148.5" stroke="#5eead4" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center engine box -->
    <rect x="430" y="54" width="420" height="181" rx="14" fill="#102521" stroke="#5eead4" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="446" y="75" font-size="14" font-weight="800" fill="#ffffff">xbbg-core · xbbg-async · xbbg-ext · xbbg-recipes</text>
    <g transform="translate(446 84)">
      <rect width="388" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="12" y="14" font-size="11.5" font-weight="700" fill="#5eead4">Request execution &amp; sharding</text>
      <text x="12" y="26" font-size="10.5" fill="#a7beb7">BDP, BDH, BDS, BDIB, BDTICK, BQL, BEQS, BSRCH, BQR, BTA, YAS</text>
    </g>
    <g transform="translate(446 122)">
      <rect width="388" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="12" y="14" font-size="11.5" font-weight="700" fill="#5eead4">Session &amp; worker pools</text>
      <text x="12" y="26" font-size="10.5" fill="#a7beb7">Round-robin request workers + shared/isolated subscription feeds</text>
    </g>
    <g transform="translate(446 160)">
      <rect width="388" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="12" y="14" font-size="11.5" font-weight="700" fill="#5eead4">Field cache, validation &amp; recipes</text>
      <text x="12" y="26" font-size="10.5" fill="#a7beb7">Type resolution, futures/CDX/ETF/bond/auction analytics, middleware</text>
    </g>
    <g transform="translate(446 198)">
      <rect width="388" height="32" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="12" y="14" font-size="11.5" font-weight="700" fill="#5eead4">Arrow C Data Interface</text>
      <text x="12" y="26" font-size="10.5" fill="#a7beb7">Columnar batches built in Rust and projected once at the API edge</text>
    </g>
    <!-- Connector: engine -> SDK -->
    <path d="M850 144.5 H894" stroke="#5eead4" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round"/>
    <path d="M890 140.5 L897 144.5 L890 148.5" stroke="#5eead4" stroke-opacity="0.8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Right SDK box -->
    <rect x="900" y="54" width="272" height="181" rx="14" fill="#102521" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="918" y="78" font-size="15" font-weight="800" fill="#ffffff">blpapi C / C++ runtime</text>
    <text x="918" y="98" font-size="11.5" fill="#a7beb7">Loaded at runtime via blpapi-sys</text>
    <g transform="translate(918 112)">
      <rect width="112" height="28" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="56" y="18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Desktop (DAPI)</text>
      <rect x="124" width="112" height="28" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="180" y="18" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">B-PIPE / SAPI</text>
      <rect y="36" width="112" height="28" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="56" y="54" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ZFP Leased Line</text>
      <rect x="124" y="36" width="112" height="28" rx="7" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.10"/>
      <text x="180" y="54" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">TLS &amp; SOCKS5</text>
    </g>
    <text x="918" y="220" font-size="11" fill="#a7beb7">Failover servers · Auth · Entitlements</text>
  </g>

</svg>
