<svg width="720" height="294" viewBox="0 0 720 294" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">xbbg install footprint comparison</title>
  <desc id="desc">Usable install footprint on Windows x64, Python 3.14: xbbg + narwhals is 19.8 MiB versus 130.8–191.1 MiB for pandas/Polars wrappers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#173f38"/>
      <stop offset="0.58" stop-color="#15302b"/>
      <stop offset="1" stop-color="#1b1a1f"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="720" height="294" rx="22"/>
    </clipPath>
  </defs>
  <rect width="720" height="294" rx="22" fill="url(#bg)"/>
  <g clip-path="url(#frame)">
    <text x="-8" y="288" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="200" font-weight="800" fill="#ffffff" opacity="0.025">xbbgxbbgxbbgxbbg</text>
  </g>
  <rect x="0.5" y="0.5" width="719" height="293" rx="21.5" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="24" y="32" font-size="13" font-weight="800" fill="#5eead4" letter-spacing="1.2">USABLE INSTALL FOOTPRINT · WINDOWS X64, PYTHON 3.14</text>
    <text x="696" y="32" font-size="12" fill="#b5cac3" text-anchor="end">Lower is smaller · narwhals only</text>
    <line x1="24" y1="44" x2="696" y2="44" stroke="#ffffff" stroke-opacity="0.10"/>
    <g transform="translate(24 58)">
      <text x="0" y="15" font-size="15" font-weight="800" fill="#ffffff">xbbg 1.8.1 + narwhals 2.28.0</text>
      <text x="0" y="32" font-size="12" fill="#b5cac3">No blpapi wheel or mandatory pandas/NumPy</text>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="296" y="7" width="26" height="20" rx="6" fill="#5eead4" fill-opacity="0.95"/>
      <text x="332" y="22" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800" fill="#5eead4">19.8 MiB</text>
      <text x="672" y="22" font-size="13" font-weight="700" fill="#5eead4" text-anchor="end">1.0×</text>
    </g>
    <g transform="translate(24 103)">
      <text x="0" y="15" font-size="15" font-weight="600" fill="#b5cac3">raw blpapi 3.26.8.1</text>
      <text x="0" y="32" font-size="12" fill="#b5cac3">Low-level C++ bindings only (no DataFrames)</text>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="296" y="7" width="19" height="20" rx="6" fill="#ffffff" fill-opacity="0.25"/>
      <text x="325" y="22" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800" fill="#ffffff">14.7 MiB</text>
      <text x="672" y="22" font-size="13" font-weight="500" fill="#b5cac3" text-anchor="end">0.74×</text>
    </g>
    <g transform="translate(24 148)">
      <text x="0" y="15" font-size="15" font-weight="600" fill="#b5cac3">pdblp 0.1.8 / blp 0.0.4</text>
      <text x="0" y="32" font-size="12" fill="#b5cac3">+ pandas 3.0.5 + numpy 2.5.3 + blpapi</text>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="296" y="7" width="171" height="20" rx="6" fill="#ffffff" fill-opacity="0.25"/>
      <text x="477" y="22" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800" fill="#ffffff">131.0 MiB</text>
      <text x="672" y="22" font-size="13" font-weight="500" fill="#b5cac3" text-anchor="end">6.6×</text>
    </g>
    <g transform="translate(24 193)">
      <text x="0" y="15" font-size="15" font-weight="600" fill="#b5cac3">bbg-fetch 3.2.0</text>
      <text x="0" y="32" font-size="12" fill="#b5cac3">+ pandas 3.0.5 + numpy 2.5.3 + blpapi</text>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="296" y="7" width="171" height="20" rx="6" fill="#ffffff" fill-opacity="0.25"/>
      <text x="477" y="22" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800" fill="#ffffff">130.9 MiB</text>
      <text x="672" y="22" font-size="13" font-weight="500" fill="#b5cac3" text-anchor="end">6.6×</text>
    </g>
    <g transform="translate(24 238)">
      <text x="0" y="15" font-size="15" font-weight="600" fill="#b5cac3">polars-bloomberg 0.6.0</text>
      <text x="0" y="32" font-size="12" fill="#b5cac3">+ polars 1.44.2 + blpapi 3.26.8.1</text>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.05"/>
      <rect x="296" y="7" width="250" height="20" rx="6" fill="#ffffff" fill-opacity="0.25"/>
      <text x="556" y="22" font-family="'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="800" fill="#ffffff">191.1 MiB</text>
      <text x="672" y="22" font-size="13" font-weight="500" fill="#b5cac3" text-anchor="end">9.6×</text>
    </g>
  </g>
</svg>
