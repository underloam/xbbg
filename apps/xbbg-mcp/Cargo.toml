[package]
name = "xbbg-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP stdio server for xbbg request/response operations"
publish = false

[[bin]]
name = "xbbg-mcp"
path = "src/main.rs"

[dependencies]
arrow = { workspace = true }
chrono = { workspace = true, features = ["std"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io", "schemars"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync"] }
# The workspace entries set `default-features = false`, so `live` must be named
# explicitly here: this binary previously inherited it via default features.
xbbg-async = { workspace = true, features = ["live"] }
xbbg-ext = { workspace = true }
xbbg-recipes = { workspace = true }
xbbg_core = { workspace = true, features = ["live"] }
xbbg-log = { workspace = true }