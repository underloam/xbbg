# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Shipped platforms: Linux x64, Windows x64/x86, macOS arm64 (wheels, napi, xbbg-mcp, JVM natives).
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
    "aarch64-apple-darwin",
]
# Include the optional stub generator and the JNI test-support fixtures so their dependencies
# are checked too.
features = ["pyo3-xbbg/stub-gen", "jni-xbbg/test-support"]

# ════════════════════════════════════════════════════════════════════════════
# Advisories - check for known security vulnerabilities
# ════════════════════════════════════════════════════════════════════════════
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = [
    # unic-* crates are unmaintained (not vulnerable). Transitive deps of
    # rustpython-parser via pyo3-stub-gen — used only for stub generation,
    # never in production code. No safe upgrade available upstream.
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0090",  # unic-emoji-char
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
    # Bloomberg runtime downloader (crates/xbbg-sdk, JVM only). uv-client depends on uv-auth
    # unconditionally (no feature drops it); xbbg-sdk builds uv's client with
    # AuthIntegration::NoAuthMiddleware, so uv's credential code never runs. Keep
    # .cargo/audit.toml in sync.
    { id = "RUSTSEC-2023-0071", reason = "rsa (Marvin timing side channel, no fixed release) via uv-client -> uv-auth -> reqsign: xbbg-sdk disables uv-auth and never signs or decrypts with RSA" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, Linux only, via uv-client -> uv-auth -> uv-keyring -> secret-service -> zbus: the keyring is never used" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, Linux only, via uv-client -> uv-auth -> uv-keyring -> secret-service -> zbus: the keyring is never used" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, Linux only, via uv-client -> uv-auth -> uv-keyring -> secret-service -> zbus: the keyring is never used" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained, via rattler_conda_types -> serde_yaml (unconditional): xbbg-sdk parses no YAML" },
]

# ════════════════════════════════════════════════════════════════════════════
# Licenses - ensure dependencies use acceptable licenses
# ════════════════════════════════════════════════════════════════════════════
[licenses]
version = 2
# Suppress warnings for allowed licenses not currently in use
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# Per-crate exceptions instead of global allows (Bloomberg runtime downloader, crates/xbbg-sdk).
[[licenses.exceptions]]
# Mozilla CA root data; an unconditional dependency of uv-client. xbbg-sdk hands uv its own
# client that verifies against the OS trust store.
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
# bzip2's BSD-style licence; rattler reads .tar.bz2 conda packages through it.
crate = "libbz2-rs-sys"
allow = ["bzip2-1.0.6"]

# ════════════════════════════════════════════════════════════════════════════
# Bans - deny specific crates or versions
# ════════════════════════════════════════════════════════════════════════════
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Only the core owns the Bloomberg SDK seam, including test fixtures. Nothing on the
    # downloader side (xbbg-sdk, jni-xbbg-sdk) may appear in these lists: that keeps
    # xbbg_sdk_jni free of blpapi.
    { name = "xbbg-blpapi-sys", wrappers = ["xbbg_core"] },
    # Internal engine layers may only be imported by their intended dependents.
    { name = "xbbg_core", wrappers = ["xbbg-async", "xbbg-bench", "xbbg-host", "pyo3-xbbg", "napi-xbbg", "jni-xbbg", "xbbg-mcp"] },
    { name = "xbbg-async", wrappers = ["xbbg-recipes", "xbbg-bench", "xbbg-host", "pyo3-xbbg", "napi-xbbg", "jni-xbbg", "xbbg-mcp"] },
    { name = "xbbg-ext", wrappers = ["xbbg-async", "xbbg-recipes", "xbbg-host", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    { name = "xbbg-log", wrappers = ["xbbg-async", "xbbg-recipes", "xbbg-host", "pyo3-xbbg", "napi-xbbg", "jni-xbbg", "xbbg-mcp"] },
    { name = "xbbg-arrow", wrappers = ["pyo3-xbbg"] },
    { name = "xbbg-recipes", wrappers = ["xbbg-host", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    # Host-neutral binding glue, shared by language bindings only.
    { name = "xbbg-host", wrappers = ["jni-xbbg"] },
    # The Bloomberg runtime downloader and its stack stay behind the provisioning binding. Only
    # the entry points can be confined: the other uv/rattler crates depend on each other.
    { name = "xbbg-sdk", wrappers = ["jni-xbbg-sdk"] },
    { name = "uv-client", wrappers = ["xbbg-sdk"] },
    { name = "rattler_repodata_gateway", wrappers = ["xbbg-sdk"] },
    # Python frameworks stay in the Python binding or their own ecosystem.
    { name = "pyo3", wrappers = ["pyo3-xbbg", "numpy", "pyo3-arrow", "pyo3-async-runtimes", "pyo3-stub-gen"] },
    { name = "numpy", wrappers = ["pyo3-arrow"] },
    { name = "pyo3-arrow", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-async-runtimes", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-stub-gen", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-stub-gen-derive", wrappers = ["pyo3-stub-gen"] },
    { name = "pyo3-build-config", wrappers = ["pyo3", "pyo3-ffi", "pyo3-xbbg", "numpy"] },
    { name = "pyo3-ffi", wrappers = ["pyo3"] },
    { name = "pyo3-macros", wrappers = ["pyo3"] },
    { name = "pyo3-macros-backend", wrappers = ["pyo3-macros"] },
    # Node.js and MCP frameworks never belong in shared engine crates.
    { name = "napi", wrappers = ["napi-xbbg"] },
    { name = "napi-build", wrappers = ["napi-xbbg", "napi"] },
    { name = "napi-derive", wrappers = ["napi-xbbg"] },
    { name = "napi-derive-backend", wrappers = ["napi-derive"] },
    { name = "napi-sys", wrappers = ["napi"] },
    { name = "rmcp", wrappers = ["xbbg-mcp"] },
    { name = "rmcp-macros", wrappers = ["rmcp"] },
    # JVM frameworks stay in the JNI bindings.
    { name = "jni", wrappers = ["jni-xbbg", "jni-xbbg-sdk"] },
    { name = "jni-sys", wrappers = ["jni"] },
    { name = "jni-macros", wrappers = ["jni"] },
]

skip = []
skip-tree = []

# ════════════════════════════════════════════════════════════════════════════
# Sources - only allow crates from trusted sources
# ════════════════════════════════════════════════════════════════════════════
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
