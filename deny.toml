# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Supported platforms: Linux x64, Windows x64/x86
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]
# Include the optional stub generator so its binding dependencies are checked too.
features = ["pyo3-xbbg/stub-gen"]

# ════════════════════════════════════════════════════════════════════════════
# Advisories - check for known security vulnerabilities
# ════════════════════════════════════════════════════════════════════════════
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
version = 2
ignore = [
    # unic-* crates are unmaintained (not vulnerable). Transitive deps of
    # rustpython-parser via pyo3-stub-gen — used only for stub generation,
    # never in production code. No safe upgrade available upstream.
    "RUSTSEC-2025-0075",  # unic-char-range
    "RUSTSEC-2025-0080",  # unic-common
    "RUSTSEC-2025-0081",  # unic-char-property
    "RUSTSEC-2025-0090",  # unic-emoji-char
    "RUSTSEC-2025-0098",  # unic-ucd-version
    "RUSTSEC-2025-0100",  # unic-ucd-ident
]

# ════════════════════════════════════════════════════════════════════════════
# Licenses - ensure dependencies use acceptable licenses
# ════════════════════════════════════════════════════════════════════════════
[licenses]
version = 2
# Suppress warnings for allowed licenses not currently in use
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

# ════════════════════════════════════════════════════════════════════════════
# Bans - deny specific crates or versions
# ════════════════════════════════════════════════════════════════════════════
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = [
    # Only the core owns the Bloomberg SDK seam, including test fixtures.
    { name = "xbbg-blpapi-sys", wrappers = ["xbbg_core"] },
    # Internal engine layers may only be imported by their intended dependents.
    { name = "xbbg_core", wrappers = ["xbbg-async", "xbbg-bench", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    { name = "xbbg-async", wrappers = ["xbbg-recipes", "xbbg-bench", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    { name = "xbbg-ext", wrappers = ["xbbg-async", "xbbg-recipes", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    { name = "xbbg-log", wrappers = ["xbbg-async", "xbbg-recipes", "pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    { name = "xbbg-arrow", wrappers = ["pyo3-xbbg"] },
    { name = "xbbg-recipes", wrappers = ["pyo3-xbbg", "napi-xbbg", "xbbg-mcp"] },
    # Python frameworks stay in the Python binding or their own ecosystem.
    { name = "pyo3", wrappers = ["pyo3-xbbg", "numpy", "pyo3-arrow", "pyo3-async-runtimes", "pyo3-stub-gen"] },
    { name = "numpy", wrappers = ["pyo3-arrow"] },
    { name = "pyo3-arrow", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-async-runtimes", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-stub-gen", wrappers = ["pyo3-xbbg"] },
    { name = "pyo3-stub-gen-derive", wrappers = ["pyo3-stub-gen"] },
    { name = "pyo3-build-config", wrappers = ["pyo3", "pyo3-ffi", "numpy"] },
    { name = "pyo3-ffi", wrappers = ["pyo3"] },
    { name = "pyo3-macros", wrappers = ["pyo3"] },
    { name = "pyo3-macros-backend", wrappers = ["pyo3-macros"] },
    # Node.js and MCP frameworks never belong in shared engine crates.
    { name = "napi", wrappers = ["napi-xbbg"] },
    { name = "napi-build", wrappers = ["napi-xbbg", "napi"] },
    { name = "napi-derive", wrappers = ["napi-xbbg"] },
    { name = "napi-derive-backend", wrappers = ["napi-derive"] },
    { name = "napi-sys", wrappers = ["napi"] },
    { name = "rmcp", wrappers = ["xbbg-mcp"] },
    { name = "rmcp-macros", wrappers = ["rmcp"] },
]

skip = []
skip-tree = []

# ════════════════════════════════════════════════════════════════════════════
# Sources - only allow crates from trusted sources
# ════════════════════════════════════════════════════════════════════════════
[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
