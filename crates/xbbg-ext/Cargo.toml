[package]
name = "xbbg-ext"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Extension utilities for xbbg: futures resolution, currency adjustment, and historical helpers"
keywords = ["bloomberg", "market-data", "finance", "timezones", "xbbg"]
categories = ["finance", "date-and-time"]
publish = ["crates-io"]
include = ["src/**/*.rs", "data/*.toml", "Cargo.toml", "README.md"]

[dependencies]
# Arrow for zero-copy DataFrame operations (narrow crates keep Python wheels small).
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-schema = { workspace = true }

# Date/time handling
chrono = { workspace = true, features = ["std", "serde"] }
chrono-tz = { workspace = true }

# Compile-time perfect hash maps for constants
phf = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Market rules loading
serde = { workspace = true }
toml = { workspace = true }

# Benchmarks have been consolidated into crates/xbbg-bench.

[lints]
workspace = true
