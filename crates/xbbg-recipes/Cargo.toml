[package]
name = "xbbg-recipes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "High-level Bloomberg recipe functions built on the xbbg-async engine"
keywords = ["bloomberg", "blpapi", "market-data", "finance", "xbbg"]
categories = ["finance", "api-bindings"]
publish = ["crates-io"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[dependencies]
xbbg-async = { workspace = true }
xbbg-ext = { workspace = true }
xbbg-log = { workspace = true }
arrow-array = { workspace = true }
arrow-arith = { workspace = true }
arrow-schema = { workspace = true }
chrono = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = ["live"]
live = ["xbbg-async/live"]
