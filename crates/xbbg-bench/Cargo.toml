[package]
name = "xbbg-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Benchmarks for xbbg — performance, allocation profiling, and live Bloomberg tests"
publish = false
autobenches = false

[lib]
name = "xbbg_bench"

[dependencies]
# Crates under test
# `live` is named explicitly because the workspace entries disable default
# features; these benchmarks previously inherited it.
xbbg_core = { workspace = true, features = ["live"] }

[dev-dependencies]
xbbg-async = { workspace = true, features = ["bench-internals", "live"] }
# Benchmark runner/runtime
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
# Spells out chrono's default feature set, previously picked up implicitly.
chrono = { workspace = true, features = ["clock", "std", "oldtime", "wasmbind"] }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }
criterion = { workspace = true }

serde_json = { workspace = true }
simd-json = { workspace = true }

# =============================================================================
# Registered benchmark targets
# =============================================================================
# Run with: cargo bench --package xbbg-bench --bench xbbg_benchmark_suite
# Offline checks: cargo bench --package xbbg-bench --bench bql_json_parsers -- --test
[[bench]]
name = "xbbg_benchmark_suite"
harness = false

[[bench]]
name = "lockfree_paths"
harness = false

[[bench]]
name = "arrow_builder_append"
harness = false

[[bench]]
name = "async_subscription_replay"
harness = false

[[bench]]
name = "cached_subscription_arrow"
harness = false

[[bench]]
name = "bql_json_parsers"
harness = false

[lints]
workspace = true
