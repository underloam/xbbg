[package]
name = "xbbg-async"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Async worker-pool engine over xbbg_core for Bloomberg API requests and subscriptions"
keywords = ["bloomberg", "blpapi", "async", "market-data", "xbbg"]
categories = ["asynchronous", "finance"]
publish = ["crates-io"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[dependencies]
xbbg_core = { workspace = true }
xbbg-ext = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
xbbg-log = { workspace = true }
once_cell = { workspace = true }
slab = { workspace = true }
arrow-array = { workspace = true, features = ["chrono-tz"] }
arrow-schema = { workspace = true }
arrow-select = { workspace = true }
futures-util = { workspace = true }
indexmap = { workspace = true }
# Spells out chrono's default feature set, which this crate previously picked up
# implicitly; `clock` is the one it actually needs for wall-clock timestamps.
chrono = { workspace = true, features = ["clock", "std", "oldtime", "wasmbind"] }
chrono-tz = { workspace = true }
iana-time-zone = { workspace = true }
parking_lot = { workspace = true }
arc-swap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
itoa = { workspace = true }
ryu = { workspace = true }
smallvec = { workspace = true }

[features]
default = ["live"]
live = ["xbbg_core/live"]
bench-internals = []

# cargo-udeps false positives (xbbg-log re-exports tracing macros)
[package.metadata.cargo-udeps.ignore]
normal = ["xbbg-log"]

[dev-dependencies]
xbbg_core = { workspace = true, features = ["test-support"] }
blpapi-sys = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
# Restores tracing-subscriber's default set on top of the env-filter this uses.
tracing-subscriber = { workspace = true, features = [
  "smallvec",
  "fmt",
  "ansi",
  "tracing-log",
  "std",
  "env-filter",
] }
