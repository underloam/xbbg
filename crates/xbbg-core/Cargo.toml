[package]
# The registry name is `xbbg_core` with an underscore. crates.io normalizes `-`
# and `_` to the same identity, so `xbbg-core` is not a separate name and cannot
# be claimed while this one exists; renaming would mean deleting this crate and
# waiting out the name-reuse block. The underscore therefore stays.
name = "xbbg_core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Safe Rust wrappers for BLPAPI session, request, and response primitives"
keywords = ["blpapi", "bloomberg", "ffi", "market-data", "xbbg"]
categories = ["api-bindings", "finance"]
publish = ["crates-io"]
include = ["src/**/*.rs", "Cargo.toml", "README.md"]

[lib]
name = "xbbg_core"

[features]
default = ["live"]
# `live` gates the FFI dependencies. The function table in src/ffi.rs and the
# loader in src/loader.rs are unconditional, so a non-live build cannot compile;
# src/lib.rs raises an explicit compile_error! so that failure is legible instead
# of surfacing as a wall of unresolved imports.
live = ["dep:blpapi-sys", "dep:libloading", "dep:libc"]
# SDK-created events for downstream regression tests; not enabled in production.
test-support = ["live"]

[dependencies]
thiserror = { workspace = true }
blpapi-sys = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
rustc-hash = { workspace = true }  # Fast non-cryptographic hashing for Name cache

# dladdr: which file the dynamic loader mapped for the runtime (see src/loader.rs).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }

[dev-dependencies]
# Loads the Bloomberg runtime before main in this crate's test binaries and examples, finding it
# with xbbg-sdk's environment lookup. Path-only, so it is stripped when the crate is published.
ctor = { workspace = true }
xbbg-sdk = { workspace = true }

# Benchmarks have been consolidated into crates/xbbg-bench.
# Run with: cargo bench --package xbbg-bench

[lints]
workspace = true
