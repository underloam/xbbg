[package]
name = "xbbg-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Locate and provision the Bloomberg BLPAPI runtime from PyPI indexes, conda channels or artifacts; never links blpapi"
publish = false

[dependencies]
# PyPI simple indexes (PEP 503 HTML and PEP 691 JSON, including Bloomberg's HTML-only index)
# through uv's registry client; wheel-name, platform-tag and version semantics from uv.
uv-cache = { workspace = true }
uv-client = { workspace = true }
uv-distribution-filename = { workspace = true }
uv-distribution-types = { workspace = true }
uv-normalize = { workspace = true }
uv-pep440 = { workspace = true }
uv-platform-tags = { workspace = true }
# conda channels: gateway with sharded repodata, package extraction, explicit credential storage.
# Never enable rattler_networking's `keyring`/`system-integration` (implicit OS credential stores).
rattler_conda_types = { workspace = true }
rattler_digest = { workspace = true }
rattler_networking = { workspace = true, features = ["rustls", "netrc-rs", "dirs"] }
rattler_package_streaming = { workspace = true, features = ["rustls"] }
# Masks conda `/t/<token>/` channel tokens in every URL the crate reports.
rattler_redaction = { workspace = true }
rattler_repodata_gateway = { workspace = true, features = ["rustls", "gateway"] }
# One HTTP stack for both ecosystems: rustls with the operating system's trust store.
reqwest = { workspace = true, features = ["rustls", "stream", "http2", "system-proxy", "socks"] }
reqwest-middleware = { workspace = true }
reqwest-retry = { workspace = true }
async-trait = { workspace = true }
http = { workspace = true }
futures-util = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "fs", "io-util", "time", "macros"] }
url = { workspace = true }
base64 = { workspace = true }
csv = { workspace = true }
hex = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
