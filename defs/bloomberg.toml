# Bloomberg API Service Definitions
# ==================================
# Single source of truth for all Bloomberg API names.
#
# Run `python defs/codegen/generate.py` to regenerate:
#   - crates/xbbg-async/src/services.rs        (Rust enums, bundles + contract tests)
#   - py-xbbg/src/xbbg/_services_gen.py        (Python enums, bundles + study vocabulary)
#   - js-xbbg/src/_defs_gen.ts                (TypeScript unions, bundles + study vocabulary)
#   - js-xbbg-langgraph/src/_defs_gen.ts      (TypeScript LangGraph vocabulary)
#   - py-xbbg-langgraph/src/xbbg_langgraph/_defs_gen.py (Python LangGraph vocabulary)
#
# Adding a new service, operation, or shared vocabulary entry:
#   1. Add the entry below
#   2. Run codegen
#   3. Commit the generated files
#
# CI runs `python defs/codegen/generate.py --check` to verify files are in sync.


# ============================================================================
# SDK Compatibility
# ============================================================================
# Oldest Bloomberg C SDK version that xbbg supports. Used by:
#   - scripts/abi-check.sh    (ABI compatibility verification)
#   - .github/workflows/      (CI matrix)
#   - crates/blpapi-sys/      (build-time validation, future)
min_sdk_version = "3.24.6.1"


# ============================================================================
# Services
# ============================================================================
# Bloomberg service URIs.  Each key becomes the Python enum name (UPPER_SNAKE).
# `rust_name` is the Rust variant name (PascalCase).
# `uri` is the Bloomberg service URI string.

[services.REFDATA]
rust_name = "RefData"
uri = "//blp/refdata"
doc = "Reference data service for bdp, bdh, bds, bdib, bdtick, beqs, bport."

[services.MKTDATA]
rust_name = "MktData"
uri = "//blp/mktdata"
doc = "Real-time market data subscriptions (subscribe, stream)."

[services.APIFLDS]
rust_name = "ApiFlds"
uri = "//blp/apiflds"
doc = "Field metadata service for field info and search (bflds)."

[services.INSTRUMENTS]
rust_name = "Instruments"
uri = "//blp/instruments"
doc = "Instruments service for security lookup (blkp)."

[services.BQLSVC]
rust_name = "BqlSvc"
uri = "//blp/bqlsvc"
doc = "Bloomberg Query Language service (bql)."

[services.EXRSVC]
rust_name = "ExrSvc"
uri = "//blp/exrsvc"
doc = "Excel/Search service for Bloomberg searches (bsrch)."

[services.TASVC]
rust_name = "TaSvc"
uri = "//blp/tasvc"
doc = "Technical Analysis service for study calculations (bta)."

[services.MKTVWAP]
rust_name = "MktVwap"
uri = "//blp/mktvwap"
doc = "Real-time VWAP subscription service (vwap)."

[services.MKTBAR]
rust_name = "MktBar"
uri = "//blp/mktbar"
doc = "Real-time streaming OHLC bars (mktbar)."

[services.MKTDEPTH]
rust_name = "MktDepth"
uri = "//blp/mktdepthdata"
doc = "Level 2 market depth / order book data (depth). Requires a B-PIPE environment and applicable entitlements."

[services.MKTLIST]
rust_name = "MktList"
uri = "//blp/mktlist"
doc = "Option chains and futures chains (chains). Requires a B-PIPE environment and applicable entitlements."


# ============================================================================
# Operations
# ============================================================================
# Bloomberg request operation names.  `value` is the Bloomberg API string.
# `service` references a services key.  `extractor` references an extractors key.
# If rust_name is omitted, it is derived from the key (UPPER_SNAKE → PascalCase).

[operations.REFERENCE_DATA]
value = "ReferenceDataRequest"
service = "REFDATA"
extractor = "REFDATA"
doc = "Single point-in-time data (bdp, bds)."

[operations.HISTORICAL_DATA]
value = "HistoricalDataRequest"
service = "REFDATA"
extractor = "HISTDATA"
doc = "Historical time series data (bdh)."

[operations.INTRADAY_BAR]
value = "IntradayBarRequest"
service = "REFDATA"
extractor = "INTRADAY_BAR"
doc = "Intraday OHLCV bars (bdib)."

[operations.INTRADAY_TICK]
value = "IntradayTickRequest"
service = "REFDATA"
extractor = "INTRADAY_TICK"
doc = "Intraday tick data (bdtick)."

[operations.FIELD_INFO]
value = "FieldInfoRequest"
service = "APIFLDS"
extractor = "FIELD_INFO"
doc = "Get field metadata (type, description)."

[operations.FIELD_SEARCH]
value = "FieldSearchRequest"
service = "APIFLDS"
extractor = "GENERIC"
doc = "Search for fields by keyword."

[operations.BEQS]
value = "BeqsRequest"
service = "REFDATA"
extractor = "GENERIC"
doc = "Bloomberg Equity Screening (BEQS)."

[operations.PORTFOLIO_DATA]
value = "PortfolioDataRequest"
service = "REFDATA"
extractor = "GENERIC"
doc = "Portfolio data request (bport)."

[operations.INSTRUMENT_LIST]
value = "instrumentListRequest"
service = "INSTRUMENTS"
extractor = "GENERIC"
doc = "Security lookup by name (blkp)."

[operations.CURVE_LIST]
value = "curveListRequest"
service = "INSTRUMENTS"
extractor = "GENERIC"
doc = "List yield curves (bcurves)."

[operations.GOVT_LIST]
value = "govtListRequest"
service = "INSTRUMENTS"
extractor = "GENERIC"
doc = "List government securities (bgovts)."

[operations.BQL_SEND_QUERY]
value = "sendQuery"
service = "BQLSVC"
extractor = "BQL"
doc = "Bloomberg Query Language query (bql)."

[operations.EXCEL_GET_GRID]
value = "ExcelGetGridRequest"
service = "EXRSVC"
extractor = "BSRCH"
doc = "Bloomberg Search/Excel grid request (bsrch)."

[operations.STUDY_REQUEST]
value = "studyRequest"
service = "TASVC"
extractor = "GENERIC"
doc = "Technical analysis study request (bta)."

[operations.RAW_REQUEST]
value = ""
rust_name = "RawRequest"
doc = "Raw session.sendRequest() call (no operation name needed)."


# ============================================================================
# Extractors
# ============================================================================
# Extractor type hints for Arrow conversion.
# Python enum: ExtractorHint.  Rust enum: ExtractorType.
# `value` is the string exchanged over FFI.

[extractors.REFDATA]
rust_name = "RefData"
value = "refdata"
default = true
doc = "Reference data extractor: [ticker, field, value, ...]"

[extractors.HISTDATA]
rust_name = "HistData"
value = "histdata"
doc = "Historical data extractor: [ticker, date, field, value, ...]"

[extractors.BULK]
rust_name = "BulkData"
value = "bulk"
doc = "Bulk data extractor: [ticker, field, row_idx, col1, col2, ...]"

[extractors.INTRADAY_BAR]
rust_name = "IntradayBar"
value = "intraday_bar"
doc = "Intraday bar extractor: [ticker, time, open, high, low, close, volume, ...]"

[extractors.INTRADAY_TICK]
rust_name = "IntradayTick"
value = "intraday_tick"
doc = "Intraday tick extractor: [ticker, time, type, value, size, ...]"

[extractors.GENERIC]
rust_name = "Generic"
value = "generic"
doc = "Generic flattener: [path, type, value_str, value_num, value_date]"

[extractors.BQL]
rust_name = "Bql"
value = "bql"
doc = "BQL: Bloomberg Query Language responses."

[extractors.BSRCH]
rust_name = "Bsrch"
value = "bsrch"
doc = "BSRCH: Bloomberg Search responses."

[extractors.FIELD_INFO]
rust_name = "FieldInfo"
value = "fieldinfo"
doc = "Field info extractor: [field, type, description, category]"


# ============================================================================
# Output Formats
# ============================================================================
# Controls the shape and typing of the output Arrow table.
# Canonical values and aliases drive the Rust request planner's Format parser.
# Parsing is case-sensitive; aliases keep the same canonical output strings.

[formats.LONG]
value = "long"
default = true
doc = "Long format with all values as strings (default, backwards-compatible)."

[formats.LONG_TYPED]
value = "long_typed"
aliases = ["typed"]
doc = "Long format with typed value columns."

[formats.LONG_WITH_METADATA]
value = "long_metadata"
aliases = ["metadata", "with_metadata"]
doc = "Long format with string values and dtype metadata column."

[formats.SEMI_LONG]
value = "semi_long"
aliases = ["wide"]
doc = "Semi-long format with one row per ticker/timestamp and fields as columns."



# ============================================================================
# Output Modes
# ============================================================================
# Controls how Bloomberg responses are converted before returning.
# Python's host-side output selection; Rust requests always return Arrow.

[output_modes.ARROW]
value = "arrow"
default = true
doc = "Convert to Arrow RecordBatch using appropriate extractor."

[output_modes.JSON]
value = "json"
doc = "Return raw JSON as a single-column Arrow table."


# ============================================================================
# Overflow Policies
# ============================================================================
# What a subscription does when the consumer cannot keep up with Bloomberg.
#
# `value` is the canonical spelling advertised to callers. `aliases` are extra
# spellings the parser accepts but which are deliberately not advertised.
# Parsing is ASCII-case-insensitive.
#
# Authority: `OverflowPolicy` in crates/xbbg-async/src/engine/mod.rs; the
# behaviour described below is `SubscriptionState::send_update` in
# crates/xbbg-async/src/engine/state/subscription.rs.

[overflow_policies.DROP_NEWEST]
rust_name = "DropNewest"
value = "drop_newest"
aliases = ["dropnewest"]
default = true
doc = "Close with a data-loss error when the consumer buffer is full; never waits on Bloomberg's callback thread. Resubscribe for a fresh image."

[overflow_policies.BLOCK]
rust_name = "Block"
value = "block"
doc = "Wait briefly on a bounded forwarding task, never on Bloomberg's callback thread; queue overflow or timeout closes with a data-loss error. Resubscribe for a fresh image."


# ============================================================================
# Validation Modes
# ============================================================================
# How aggressively field names are validated before a request is sent.
#
# Authority: `ValidationMode` in crates/xbbg-async/src/engine/mod.rs.

[validation_modes.DISABLED]
rust_name = "Disabled"
value = "disabled"
aliases = ["off", "none"]
default = true
doc = "No field validation (default)."

[validation_modes.STRICT]
rust_name = "Strict"
value = "strict"
doc = "Reject the request when any field is unknown."

[validation_modes.LENIENT]
rust_name = "Lenient"
value = "lenient"
doc = "Drop unknown fields and send the remaining ones."


# ============================================================================
# SDK Log Levels
# ============================================================================
# Verbosity of the Bloomberg C SDK's own logging.
#
# Authority: `SdkLogLevel` in crates/xbbg-async/src/sdk_logging.rs.

[sdk_log_levels.OFF]
rust_name = "Off"
value = "off"
default = true
doc = "Disable SDK logging (default)."

[sdk_log_levels.FATAL]
rust_name = "Fatal"
value = "fatal"
doc = "Fatal errors only."

[sdk_log_levels.ERROR]
rust_name = "Error"
value = "error"
doc = "Errors and above."

[sdk_log_levels.WARN]
rust_name = "Warn"
value = "warn"
aliases = ["warning"]
doc = "Warnings and above."

[sdk_log_levels.INFO]
rust_name = "Info"
value = "info"
doc = "Informational messages and above."

[sdk_log_levels.DEBUG]
rust_name = "Debug"
value = "debug"
doc = "Debug messages and above."

[sdk_log_levels.TRACE]
rust_name = "Trace"
value = "trace"
doc = "Most verbose SDK logging."


