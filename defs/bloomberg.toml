# ============================================================================
# LangGraph contract vocabulary
# ============================================================================
# These package-local copies must not import a native binding at module load.
# Execution stays language-specific: Python's request_timeout is per call, in
# seconds; JS's engineConfig.requestTimeoutMs configures lazily created engines.
# Their 60-second defaults are intentionally not one lifecycle contract.
[langgraph]
tool_names = [
    "xbbg_bdp", "xbbg_bdh", "xbbg_bds", "xbbg_bdib", "xbbg_bdtick",
    "xbbg_check_entitlements", "xbbg_bql", "xbbg_bsrch", "xbbg_bqr", "xbbg_bflds",
    "xbbg_beqs", "xbbg_yas", "xbbg_preferreds", "xbbg_corporate_bonds",
    "xbbg_index_members", "xbbg_resolve_isins", "xbbg_resolve_venues",
    "xbbg_auction_snapshot", "xbbg_issuer_isins", "xbbg_etf_holdings",
    "xbbg_stream_snapshot", "xbbg_mktbar_snapshot", "xbbg_depth_snapshot",
    "xbbg_ext_ticker", "xbbg_ext_futures", "xbbg_ext_cdx", "xbbg_ext_currency",
    "xbbg_ext_bql_builder", "xbbg_ext_chart_spec", "xbbg_ext_market_session",
    "xbbg_ext_yas_overrides", "xbbg_ext_constants", "xbbg_ext_columns",
    "xbbg_ext_calculate",
]
# Preserve the published Python tuple order while sharing every tool identity.
python_tool_order_before = { xbbg_issuer_isins = "xbbg_resolve_venues" }
# Reference data excludes the historical-only pivot. Names reference [formats].
reference_formats = ["LONG", "LONG_TYPED", "LONG_WITH_METADATA"]

[langgraph.limits]
max_securities = 25
max_fields = 25
max_rows = 500
max_string_chars = 2000
max_result_bytes = 1_048_576
max_result_nodes = 50_000
max_content_bytes = 65_536
max_content_rows = 50
max_bql_query_chars = 4000
max_search_spec_chars = 1000
max_stream_updates = 10
max_stream_wait_ms = 15_000

[langgraph.result]
MAX_RESULT_DEPTH = 32
MIN_TOOL_RESULT_NODES = 10
MAX_ERROR_DIAGNOSTICS = 8
RESULT_ENVELOPE_RESERVE_BYTES = 768
CONTENT_ENVELOPE_RESERVE_BYTES = 768
MIN_TOOL_RESULT_BYTES = 256
MAX_ENTITLEMENT_EIDS = 10_000
MAX_BLOOMBERG_EID = 2_147_483_647
MAX_EID_SECURITIES = 1_000
MAX_EID_SECURITY_NAME_BYTES = 65_536
# These budgets belong to JS's descriptor/entitlement projection, not Arrow.
javascript_only_limits = [
    "MAX_ERROR_DIAGNOSTICS", "RESULT_ENVELOPE_RESERVE_BYTES",
    "CONTENT_ENVELOPE_RESERVE_BYTES", "MAX_EID_SECURITIES",
    "MAX_EID_SECURITY_NAME_BYTES",
]
error_keys = [
    "error", "errors", "responseError", "responseErrors", "securityError",
    "securityErrors", "fieldException", "fieldExceptions", "fieldErrors",
    "unsubscribeError",
]
# Python also receives snake_case Arrow/native metadata; JS probes accessors
# without invoking them and applies its own entitlement projection limits.
python_error_keys = [
    "response_error", "response_errors", "security_error", "security_errors",
    "field_exception", "field_exceptions", "field_errors", "unsubscribe_error",
]
priority_keys = [
    "truncated", "truncatedInput", "eidData", "eidDataTruncation", "diagnostics",
    "metadata",
]
python_priority_keys = [
    "hasErrors", "truncated", "truncatedInput", "eidData", "eidDataTruncation",
    "entitled", "failedEids", "diagnostics", "metadata", "rowCount", "updateCount",
    "renderable", "spec",
]
truncation_reasons = [
    "max_rows", "max_string_chars", "max_result_bytes", "max_result_nodes",
    "max_result_depth", "circular_reference", "binary_data", "accessor_omitted",
    "unsupported_value", "invalid_entitlement_data", "entitlement_limit",
    "upstream_truncation",
]
javascript_only_reasons = ["accessor_omitted", "invalid_entitlement_data", "entitlement_limit"]

